<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>Signal</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e6e8ec;--buy:#00a86b;--sell:#e5383b;--hold:#2563eb;--wait:#94a3b8;--acc:#4f46e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b0f14;--card:#141a22;--ink:#e8edf3;--mute:#8b98a8;--line:#222b36;--buy:#2ee6a0;--sell:#ff5d63;--hold:#6ea0ff;--wait:#6b7686;--acc:#8b87ff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b0f14;--card:#141a22;--ink:#e8edf3;--mute:#8b98a8;--line:#222b36;--buy:#2ee6a0;--sell:#ff5d63;--hold:#6ea0ff;--wait:#6b7686;--acc:#8b87ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Noto Sans Thai",sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:14px 18px 8px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:22px;font-weight:750;letter-spacing:-.4px}h1 small{display:block;font-size:12px;font-weight:500;color:var(--mute);letter-spacing:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ib{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:17px}
main{padding:4px 16px 16px;max-width:640px;margin:auto}
.demo{font-size:12px;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:7px 10px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.sum b{font-size:22px;display:block}.sum span{font-size:12px;color:var(--mute)}
.b{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;color:#fff}
.BUY{background:var(--buy)}.SELL{background:var(--sell)}.HOLD{background:var(--hold)}.WAIT{background:var(--wait)}
.t{font-weight:700;font-size:16px}.m{color:var(--mute);font-size:12.5px}.up{color:var(--buy)}.dn{color:var(--sell)}
.price{font-size:34px;font-weight:750;letter-spacing:-1px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:10px 0}
.seg button{flex:1;padding:6px 0;border-radius:9px;font-size:13px;color:var(--mute)}.seg .on{background:var(--acc);color:#fff}
canvas{width:100%;height:290px;display:block;touch-action:pan-y}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px}.kv span:nth-child(odd){color:var(--mute)}
.sw{position:relative;width:46px;height:28px;border-radius:99px;background:var(--line);transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)}.sw.on::after{left:21px}
h3{font-size:13px;color:var(--mute);font-weight:600;margin:16px 4px 8px;text-transform:uppercase;letter-spacing:.5px}
.li{padding:11px 0;border-top:1px solid var(--line)}.li:first-child{border:0}
input[type=number],input[type=time]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;width:110px;text-align:right}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:9}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mute);padding:4px}nav b{font-size:20px;font-weight:400}nav .on{color:var(--acc);font-weight:700}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90%}#toast.s{opacity:1}
</style></head><body>
<header><h1 id="ttl">สัญญาณวันนี้<small id="sub"></small></h1><button class="ib" id="th" aria-label="สลับธีม">◐</button></header>
<main id="v"></main>
<nav><button data-v="today"><b>🚦</b>สัญญาณ</button><button data-v="detail"><b>📈</b>กราฟ</button><button data-v="alerts"><b>🔔</b>แจ้งเตือน</button></nav>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),fmt=n=>Math.round(n).toLocaleString('en-US');
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cfg=Object.assign({capital:10000,theme:'',ch:{ha:true,push:true,ntfy:false,tg:false},ev:{buy:true,sell:true,sl:true,tp:false},time:'04:30'},store.get('cfg',{}));
const save=()=>store.set('cfg',cfg);
if(cfg.theme)document.documentElement.dataset.theme=cfg.theme;
function toast(t){const e=$('#toast');e.textContent=t;e.className='s';setTimeout(()=>e.className='',2200)}
// ---- demo data (fictional prices, seeded) ----
const rng=s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
function mk(seed,p0,vol,dr,n=260){const r=rng(seed),d=[],t=new Date();while(d.length<n){if(t.getDay()%6)d.unshift(t.toISOString().slice(0,10));t.setDate(t.getDate()-1)}
 let c=p0;return d.map(dt=>{const o=c*(1+(r()-.5)*vol*.4);c=o*(1+dr+(r()-.5)*vol*2);return{d:dt,o,c,h:Math.max(o,c)*(1+r()*vol*.5),l:Math.min(o,c)*(1-r()*vol*.5)}})}
const sma=(a,n,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((s,x)=>s+x.c,0)/n;
function analyse(B){const st=B.map((_,i)=>{const f=sma(B,20,i),s=sma(B,50,i);return f&&s?+(f>s):0}),T=[];let e=null;
 for(let i=1;i<B.length-1;i++){if(st[i]&&!st[i-1]&&e==null)e=i+1;else if(!st[i]&&st[i-1]&&e!=null){T.push({i0:e,i1:i+1,r:B[i+1].o/B[e].o-1.004});e=null}}
 if(e!=null)T.push({i0:e,i1:null,r:B[B.length-1].c/B[e].o-1.002});
 const n=B.length-1,a=st[n]&&!st[n-1]?'BUY':!st[n]&&st[n-1]?'SELL':st[n]?'HOLD':'WAIT';return{T,a}}
const NAMES=[['NVDA','NVIDIA',1,120,.024,.0011],['AAPL','Apple',2,180,.014,.0004],['MSFT','Microsoft',3,330,.013,.0005],['TSLA','Tesla',4,240,.03,.0],['AMD','AMD',5,110,.026,.0006],['GOOGL','Alphabet',6,140,.016,.0003]];
const S=NAMES.map(([k,nm,sd,p,v,dr])=>{const B=mk(sd*77,p,v,dr),x=analyse(B);return{k,nm,B,...x}});
let sel=0,rg=120,view='today',hv=null;
// ---- views ----
function spark(B){const a=B.slice(-40).map(b=>b.c),lo=Math.min(...a),hi=Math.max(...a);return`<svg width="64" height="26" viewBox="0 0 64 26"><polyline fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" points="${a.map((v,i)=>`${i*64/39},${24-(v-lo)/(hi-lo||1)*22}`).join(' ')}"/></svg>`}
const chg=B=>B[B.length-1].c/B[B.length-2].c-1;
function today(){const c={BUY:0,SELL:0,HOLD:0};S.forEach(s=>c[s.a]!==undefined&&c[s.a]++);
 $('#v').innerHTML=`<div class="demo">โหมดตัวอย่าง: ราคาเป็นข้อมูลสมมติเพื่อดูหน้าตา ไม่ใช่ราคาจริง</div>
 <div class="sum"><div><b class="up">${c.BUY}</b><span>สัญญาณซื้อ</span></div><div><b class="dn">${c.SELL}</b><span>สัญญาณขาย</span></div><div><b>${c.HOLD}</b><span>ถืออยู่</span></div></div>`+
 [...S].sort((a,b)=>'BUY SELL HOLD WAIT'.indexOf(a.a)-'BUY SELL HOLD WAIT'.indexOf(b.a)).map(s=>{const i=S.indexOf(s),ch=chg(s.B);
 return`<div class="card" data-i="${i}"><div class="row"><div><div class="t">${s.k}</div><div class="m">${s.nm} · SMA 20/50</div></div><span class="b ${s.a}">${s.a}</span></div>
 <div class="row" style="margin-top:10px"><div><b style="font-size:20px">${s.B[s.B.length-1].c.toFixed(2)}</b> <span class="${ch>=0?'up':'dn'}" style="font-size:13px">${ch>=0?'+':''}${(ch*100).toFixed(2)}%</span></div><span class="${ch>=0?'up':'dn'}">${spark(s.B)}</span></div></div>`}).join('');
 document.querySelectorAll('.card[data-i]').forEach(e=>e.onclick=()=>{sel=+e.dataset.i;go('detail')})}
function detail(){const s=S[sel],B=s.B,l=B[B.length-1],cap=cfg.capital,op=s.T.find(t=>t.i1==null);
 const cl=s.T.filter(t=>t.i1!=null),tot=cl.reduce((a,t)=>a*(1+t.r),1)-1,w=cl.filter(t=>t.r>0).length;
 $('#v').innerHTML=`<div class="row"><div><div class="m">${s.nm}</div><div class="price">${l.c.toFixed(2)}</div></div><span class="b ${s.a}" style="font-size:14px;padding:5px 14px">${s.a}</span></div>
 <div class="seg">${[['3 เดือน',63],['6 เดือน',120],['1 ปี',250]].map(([t,n])=>`<button data-r="${n}" class="${rg==n?'on':''}">${t}</button>`).join('')}</div>
 <div class="card" style="padding:8px 6px 4px"><div class="m" id="hov" style="padding:0 8px 4px;min-height:18px">แตะบนกราฟเพื่อดูราคา</div><canvas id="cv"></canvas>
 <div class="m" style="padding:2px 8px 6px">▲ ซื้อ · ▼ ขาย พร้อมกำไร/ขาดทุนจากเงินลงทุน ฿${fmt(cap)}</div></div>
 <h3>สรุปถ้าทำตามสัญญาณ</h3><div class="card"><div class="kv"><span>เทรดที่ปิดแล้ว</span><b>${cl.length} ครั้ง (ชนะ ${w})</b><span>ผลรวมทบต้น</span><b class="${tot>=0?'up':'dn'}">${tot>=0?'+':''}${(tot*100).toFixed(1)}% · ฿${fmt(cap*tot)}</b>
 ${op?`<span>ถืออยู่ตอนนี้</span><b class="${op.r>=0?'up':'dn'}">${op.r>=0?'+':''}${(op.r*100).toFixed(1)}% · ฿${fmt(cap*op.r)}</b>`:''}</div></div>
 <button class="card row" style="width:100%" id="al"><span>🔔 แจ้งเตือนสัญญาณของ ${s.k}</span><span class="sw on"></span></button>`;
 document.querySelectorAll('[data-r]').forEach(e=>e.onclick=()=>{rg=+e.dataset.r;hv=null;detail()});
 $('#al').onclick=e=>{const w=e.currentTarget.querySelector('.sw');w.classList.toggle('on');toast(w.classList.contains('on')?'เปิดแจ้งเตือน '+s.k:'ปิดแจ้งเตือน '+s.k)};
 const cv=$('#cv');draw(cv);const pick=ev=>{const r=cv.getBoundingClientRect(),n=Math.min(rg,B.length);hv=Math.max(0,Math.min(n-1,Math.floor((ev.clientX-r.left-6)/(r.width-52)*n)));draw(cv)};
 cv.onpointerdown=pick;cv.onpointermove=ev=>{if(ev.buttons||ev.pointerType==='mouse')pick(ev)}}
function draw(cv){const s=S[sel],n=Math.min(rg,s.B.length),off=s.B.length-n,B=s.B.slice(-n),dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
 cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);const cs=getComputedStyle(document.documentElement),C=k=>cs.getPropertyValue(k).trim(),P={l:6,r:46,t:12,b:14};
 const lo=Math.min(...B.map(b=>b.l))*.995,hi=Math.max(...B.map(b=>b.h))*1.005,bw=(w-P.l-P.r)/n,X=i=>P.l+(i+.5)*bw,Y=v=>P.t+(hi-v)/(hi-lo)*(h-P.t-P.b);
 g.font='11px system-ui';g.textAlign='left';for(let k=0;k<4;k++){const v=lo+(hi-lo)*k/3,y=Y(v);g.strokeStyle=C('--line');g.beginPath();g.moveTo(P.l,y);g.lineTo(w-P.r,y);g.stroke();g.fillStyle=C('--mute');g.fillText(v.toFixed(0),w-P.r+6,y+4)}
 B.forEach((b,i)=>{const up=b.c>=b.o;g.strokeStyle=g.fillStyle=C(up?'--buy':'--sell');g.beginPath();g.moveTo(X(i),Y(b.h));g.lineTo(X(i),Y(b.l));g.stroke();g.fillRect(X(i)-bw*.33,Math.min(Y(b.o),Y(b.c)),bw*.66,Math.max(1,Math.abs(Y(b.o)-Y(b.c))))});
 const tri=(x,y,dir,col)=>{g.fillStyle=col;g.beginPath();g.moveTo(x,y);g.lineTo(x-6,y+dir*11);g.lineTo(x+6,y+dir*11);g.closePath();g.fill()};g.textAlign='center';g.font='bold 11px system-ui';
 s.T.forEach(t=>{const a=t.i0-off,z=t.i1==null?null:t.i1-off;if(a>=0&&a<n)tri(X(a),Y(B[a].l)+3,1,C('--buy'));
  if(z!=null&&z>=0&&z<n){tri(X(z),Y(B[z].h)-3,-1,C('--sell'));const v=cfg.capital*t.r;g.fillStyle=C(v>=0?'--buy':'--sell');g.fillText((v>=0?'+':'-')+'฿'+fmt(Math.abs(v)),X(z),Y(B[z].h)-18)}});
 if(hv!=null&&hv<n){const b=B[hv];g.strokeStyle=C('--mute');g.setLineDash([3,3]);g.beginPath();g.moveTo(X(hv),P.t);g.lineTo(X(hv),h-P.b);g.stroke();g.setLineDash([]);
  $('#hov').textContent=`${b.d} · O ${b.o.toFixed(2)} H ${b.h.toFixed(2)} L ${b.l.toFixed(2)} C ${b.c.toFixed(2)}`}}
function sw(on){return`<span class="sw ${on?'on':''}"></span>`}
function alerts(){const ch=[['ha','Home Assistant','ส่งเข้าแอปมือถือผ่าน HA Companion'],['push','แจ้งเตือนบนเครื่องนี้','Push ของแอป (PWA)'],['ntfy','ntfy','แอป ntfy บน Android'],['tg','Telegram','บอทส่วนตัว']],
 ev=[['buy','สัญญาณซื้อใหม่'],['sell','สัญญาณขาย'],['sl','ราคาแตะ Stop-loss'],['tp','ราคาแตะ Take-profit']];
 $('#v').innerHTML=`<h3>ช่องทางแจ้งเตือน</h3><div class="card">${ch.map(([k,t,d])=>`<div class="li row" data-c="${k}"><div><div class="t" style="font-size:15px">${t}</div><div class="m">${d}</div></div>${sw(cfg.ch[k])}</div>`).join('')}</div>
 <h3>แจ้งเมื่อ</h3><div class="card">${ev.map(([k,t])=>`<div class="li row" data-e="${k}"><span>${t}</span>${sw(cfg.ev[k])}</div>`).join('')}</div>
 <h3>ตั้งค่าอื่น ๆ</h3><div class="card"><div class="li row"><span>เวลาสแกนทุกวัน (เวลาไทย)</span><input type="time" id="tm" value="${cfg.time}"></div>
 <div class="li row"><span>เงินลงทุน (บาท)</span><input type="number" id="cp" value="${cfg.capital}" step="1000" min="0"></div></div>
 <button class="card row" style="width:100%;justify-content:center;color:var(--acc);font-weight:700" id="ts">ส่งแจ้งเตือนทดสอบ</button>
 <div class="m" style="padding:0 6px">ในเวอร์ชันจริง ระบบหลังบ้านบน NAS สแกนหลังตลาดสหรัฐปิด แล้วส่งแจ้งเตือนตามช่องทางที่เลือก</div>`;
 document.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>{const k=e.dataset.c;cfg.ch[k]=!cfg.ch[k];save();alerts()});
 document.querySelectorAll('[data-e]').forEach(e=>e.onclick=()=>{const k=e.dataset.e;cfg.ev[k]=!cfg.ev[k];save();alerts()});
 $('#tm').onchange=e=>{cfg.time=e.target.value;save();toast('บันทึกเวลาสแกนแล้ว')};$('#cp').onchange=e=>{cfg.capital=Math.max(0,+e.target.value||0);save();toast('บันทึกเงินลงทุนแล้ว')};
// แทนที่ฟังก์ชันปุ่มทดสอบแจ้งเตือนเดิมใน index.html
$('#ts').onclick = async () => {
  try {
    const r = await fetch('api/test-notify', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({channel: 'ntfy'})
    });
    const j = await r.json();
    toast(r.ok ? 'ผลส่ง: ' + JSON.stringify(j) : 'ส่งไม่สำเร็จ (' + r.status + ')');
  } catch (e) {
    toast('เชื่อมต่อ server ไม่ได้: ' + e.message);
  }
};
function go(v){view=v;hv=null;const t={today:'สัญญาณวันนี้',detail:S[sel].k,alerts:'แจ้งเตือน'};$('#ttl').firstChild.textContent=t[v];
 $('#sub').textContent=v==='today'?new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long'}):v==='detail'?S[sel].nm:'เลือกว่าอยากให้เตือนอะไร ทางไหน';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));({today,detail,alerts})[v]();scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#th').onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).colorScheme.includes('dark');cfg.theme=dark?'light':'dark';d.dataset.theme=cfg.theme;save();if(view==='detail')draw($('#cv'))};
addEventListener('resize',()=>{if(view==='detail')draw($('#cv'))});go('today');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
