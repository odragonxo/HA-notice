<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>Signal</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e6e8ec;--buy:#00a86b;--sell:#e5383b;--hold:#2563eb;--wait:#94a3b8;--acc:#4f46e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b0f14;--card:#141a22;--ink:#e8edf3;--mute:#8b98a8;--line:#222b36;--buy:#2ee6a0;--sell:#ff5d63;--hold:#6ea0ff;--wait:#6b7686;--acc:#8b87ff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b0f14;--card:#141a22;--ink:#e8edf3;--mute:#8b98a8;--line:#222b36;--buy:#2ee6a0;--sell:#ff5d63;--hold:#6ea0ff;--wait:#6b7686;--acc:#8b87ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Noto Sans Thai",sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:14px 18px 8px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:22px;font-weight:750;letter-spacing:-.4px}h1 small{display:block;font-size:12px;font-weight:500;color:var(--mute);letter-spacing:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}.ib{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:17px}
main{padding:4px 16px 16px;max-width:640px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}.sum b{font-size:22px;display:block}.sum span{font-size:12px;color:var(--mute)}
.b{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;color:#fff}.BUY{background:var(--buy)}.SELL{background:var(--sell)}.HOLD{background:var(--hold)}.WAIT{background:var(--wait)}
.t{font-weight:700;font-size:16px}.m{color:var(--mute);font-size:12.5px}.up{color:var(--buy)}.dn{color:var(--sell)}.price{font-size:34px;font-weight:750;letter-spacing:-1px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:10px 0}.seg button{flex:1;padding:6px 0;border-radius:9px;font-size:13px;color:var(--mute)}.seg .on{background:var(--acc);color:#fff}
canvas{width:100%;height:290px;display:block;touch-action:pan-y}.kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px}.kv span:nth-child(odd){color:var(--mute)}
.sw{position:relative;width:46px;height:28px;border-radius:99px;background:var(--line);transition:.2s;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--acc)}.sw.on::after{left:21px}
h3{font-size:13px;color:var(--mute);font-weight:600;margin:16px 4px 8px;text-transform:uppercase;letter-spacing:.5px}.li{padding:11px 0;border-top:1px solid var(--line)}.li:first-child{border:0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}input[type=number],input[type=time]{width:110px;text-align:right}
.btn{background:var(--acc);color:#fff;border-radius:12px;padding:9px 16px;font-weight:700}.ghost{background:var(--bg);color:var(--acc);border:1px solid var(--line);border-radius:10px;padding:5px 11px;font-size:12.5px;font-weight:600}.red{color:var(--sell)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:9}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:4px}nav b{font-size:20px;font-weight:400}nav .on{color:var(--acc);font-weight:700}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90%}#toast.s{opacity:1}
</style></head><body>
<header><h1 id="ttl">สัญญาณวันนี้<small id="sub"></small></h1><button class="ib" id="th" aria-label="สลับธีม">◐</button></header>
<main id="v"></main>
<nav><button data-v="today"><b>🚦</b>สัญญาณ</button><button data-v="detail"><b>📈</b>กราฟ</button><button data-v="tests"><b>🧪</b>ผลทดสอบ</button><button data-v="alerts"><b>🔔</b>แจ้งเตือน</button><button data-v="more"><b>⋯</b>เพิ่มเติม</button></nav><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),fmt=n=>Math.round(n).toLocaleString('en-US'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let tok=store.get('tok',''),theme=store.get('theme',''),ST=null,CAT=null,CH=null,sel=null,rg=120,view='today',hv=null;
if(theme)document.documentElement.dataset.theme=theme;
function toast(t){const e=$('#toast');e.textContent=t;e.className='s';setTimeout(()=>e.className='',2400)}
async function A(p,method='GET',body){const r=await fetch('api/'+p,{method,headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:body===undefined?undefined:JSON.stringify(body)});
 if(r.status===401){const pw=prompt('รหัสผ่านของ Signal Hub');if(pw){const l=await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})}).then(x=>x.json());if(l.token){tok=l.token;store.set('tok',tok);return A(p,method,body)}toast(l.error||'เข้าสู่ระบบไม่สำเร็จ')}throw new Error('ต้องเข้าสู่ระบบ')}
 const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
const run=f=>async(...a)=>{try{return await f(...a)}catch(e){toast(e.message||'เกิดข้อผิดพลาด')}};
const cap=()=>ST?.settings?.capital||10000,pc=x=>(x>=0?'+':'')+(x*100).toFixed(1)+'%',money=x=>(x>=0?'+':'-')+'฿'+fmt(Math.abs(x));
async function refresh(){ST=await A('state');CAT=CAT||await A('catalog')}
const opts=cur=>Object.entries(CAT.strategies).map(([k,v])=>`<option value="${k}"${k===cur?' selected':''}>${esc(v.label)}</option>`).join('');
const sw=on=>`<span class="sw ${on?'on':''}"></span>`;
// ---------- today ----------
function spark(a){if(!a||a.length<2)return'';const lo=Math.min(...a),hi=Math.max(...a);return`<svg width="64" height="26" viewBox="0 0 64 26"><polyline fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" points="${a.map((v,i)=>`${i*64/(a.length-1)},${24-(v-lo)/(hi-lo||1)*22}`).join(' ')}"/></svg>`}
async function today(){await refresh();const it=ST.items,s=ST.status,c={BUY:0,SELL:0,HOLD:0};it.forEach(i=>c[i.action]!==undefined&&c[i.action]++);
 const er=Object.entries(s.errors||{});const ord='BUY SELL HOLD WAIT';
 $('#v').innerHTML=`<div class="sum"><div><b class="up">${c.BUY}</b><span>สัญญาณซื้อ</span></div><div><b class="dn">${c.SELL}</b><span>สัญญาณขาย</span></div><div><b>${c.HOLD}</b><span>ถืออยู่</span></div></div>
 <div class="m" style="margin:0 4px 10px">สแกนล่าสุด ${s.last_scan?esc(s.last_scan.replace('T',' ')):'ยังไม่เคย'} · แรมว่าง ${s.free_mb>9e5?'-':s.free_mb+'MB'}${s.scanning?' · กำลังสแกน…':''}</div>
 ${er.length?`<div class="card m" style="color:var(--sell)">${er.map(([k,v])=>esc(k==='_'?'':k+': ')+esc(v)).join('<br>')}</div>`:''}`+
 (it.length?[...it].sort((a,b)=>ord.indexOf(a.action)-ord.indexOf(b.action)).map(i=>{const ch=i.chg||0;return`<div class="card" data-t="${esc(i.ticker)}"><div class="row"><div><div class="t">${esc(i.ticker)} ${i.alert===false?'<span class="m">🔕</span>':''}</div><div class="m">${esc(CAT.strategies[i.strategy]?.label||i.strategy)}</div></div><span class="b ${i.action}">${i.action}</span></div>
 <div class="row" style="margin-top:10px"><div><b style="font-size:20px">${i.price!=null?i.price.toFixed(2):'-'}</b> <span class="${ch>=0?'up':'dn'}" style="font-size:13px">${i.price!=null?pc(ch):''}</span></div><span class="${ch>=0?'up':'dn'}">${spark(i.spark)}</span></div></div>`}).join(''):'<div class="card m">ยังไม่มีหุ้นที่ติดตาม เพิ่มได้ด้านล่าง</div>')+
 `<h3>เพิ่มหุ้น</h3><div class="card"><div class="row"><input id="nt" placeholder="เช่น NVDA" autocapitalize="characters" style="flex:1"><select id="ns" style="flex:1.4">${opts('gtr_default')}</select></div>
 <div class="row" style="margin-top:10px"><button class="btn" id="na" style="flex:1">เพิ่มและสแกน</button><button class="ghost" id="sc">สแกนทั้งหมดตอนนี้</button></div></div>`;
 document.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{sel=e.dataset.t;go('detail')});
 $('#na').onclick=run(async()=>{const t=$('#nt').value.trim();if(!t)return toast('ใส่ชื่อหุ้นก่อน');await A('watchlist','POST',{ticker:t,strategy:$('#ns').value});toast('เพิ่ม '+t.toUpperCase()+' แล้ว กำลังสแกน');setTimeout(()=>view==='today'&&go('today'),4000);go('today')});
 $('#sc').onclick=run(async()=>{await A('scan','POST',{});toast('เริ่มสแกนแล้ว');setTimeout(()=>view==='today'&&go('today'),5000)})}
// ---------- detail ----------
async function detail(){await refresh();if(!sel)sel=ST.items[0]?.ticker;
 if(!sel){$('#v').innerHTML='<div class="card m">ยังไม่มีหุ้น เพิ่มได้ที่หน้าสัญญาณ</div>';return}
 const it=ST.items.find(i=>i.ticker===sel)||{ticker:sel,strategy:'gtr_default',action:'WAIT',alert:false,msg:'ยังไม่ได้ติดตามหุ้นนี้ (กด + ติดตาม ในหน้าสแกน)'};$('#v').innerHTML='<div class="card m">กำลังคำนวณกราฟ… (ครั้งแรกอาจใช้ 10-30 วินาทีบน Pi)</div>';
 try{CH=await A('chart/'+sel)}catch(e){$('#v').innerHTML=`<div class="card" style="color:var(--sell)">${esc(e.message)}</div>`;return}
 const B=CH.bars,l=B[B.length-1],c=cap(),cl=CH.trades.filter(t=>t.status==='ปิดแล้ว'),op=CH.trades.find(t=>t.status!=='ปิดแล้ว'),sum=cl.reduce((a,t)=>a+c*t.ret,0),lv=it.levels;
 $('#v').innerHTML=`<div class="row"><div><div class="m">${esc(CAT.strategies[it.strategy]?.label||it.strategy)}</div><div class="price">${l.c.toFixed(2)}</div></div><span class="b ${it.action}" style="font-size:14px;padding:5px 14px">${it.action}</span></div>
 <div class="seg">${[['3 เดือน',63],['6 เดือน',120],['1 ปี',250]].map(([t,n])=>`<button data-r="${n}" class="${rg==n?'on':''}">${t}</button>`).join('')}</div>
 <div class="card" style="padding:8px 6px 4px"><div class="m" id="hov" style="padding:0 8px 4px;min-height:18px">แตะบนกราฟเพื่อดูราคา</div><canvas id="cv"></canvas><div class="m" style="padding:2px 8px 6px">▲ ซื้อ · ▼ ขาย พร้อมกำไร/ขาดทุนจากเงินลงทุน ฿${fmt(c)} ต่อเทรด</div></div>
 ${lv?`<h3>ระดับของเทรด${lv.est?' (ประมาณ)':''}</h3><div class="card"><div class="kv"><span>ราคาเข้า</span><b>${lv.entry.toFixed(2)}</b><span>Stop-loss</span><b class="dn">${lv.sl.toFixed(2)}</b>${lv.tp.map((p,i)=>`<span>เป้า TP${i+1}${lv.hit>i?' ✓':''}</span><b class="up">${p.toFixed(2)}</b>`).join('')}</div></div>`:''}
 <h3>ถ้าทำตามสัญญาณ (ย้อนหลัง)</h3><div class="card"><div class="kv"><span>เทรดที่ปิดแล้ว</span><b>${cl.length} ครั้ง (ชนะ ${cl.filter(t=>t.ret>0).length})</b><span>กำไร/ขาดทุนรวม</span><b class="${sum>=0?'up':'dn'}">${money(sum)}</b>${op?`<span>ถืออยู่ตอนนี้</span><b class="${op.ret>=0?'up':'dn'}">${pc(op.ret)} · ${money(c*op.ret)}</b>`:''}</div><div class="m" style="margin-top:8px">${esc(it.msg||'')}</div></div>
 <h3>ตั้งค่าของ ${esc(sel)}</h3><div class="card"><div class="li row"><span>กลยุทธ์</span><select id="st">${opts(it.strategy)}</select></div><div class="li row" id="al"><span>แจ้งเตือนหุ้นนี้</span>${sw(it.alert!==false)}</div><div class="li row"><span class="m">ใช้ค่าพารามิเตอร์มาตรฐานของกลยุทธ์</span><button class="ghost red" id="rm">ลบออกจากรายการ</button></div></div>`;
 document.querySelectorAll('[data-r]').forEach(e=>e.onclick=()=>{rg=+e.dataset.r;hv=null;draw()});
 $('#st').onchange=run(async e=>{await A('watchlist/'+sel,'PUT',{strategy:e.target.value,params:CAT.strategies[e.target.value].params});toast('เปลี่ยนกลยุทธ์แล้ว กำลังสแกนใหม่');setTimeout(()=>view==='detail'&&go('detail'),5000)});
 $('#al').onclick=run(async()=>{await A('watchlist/'+sel,'PUT',{alert:it.alert===false});toast('บันทึกแล้ว');go('detail')});
 $('#rm').onclick=run(async()=>{if(!confirm('ลบ '+sel+' ออกจากรายการ?'))return;await A('watchlist/'+sel,'DELETE');sel=null;go('today')});
 const cv=$('#cv');draw();const pick=ev=>{const r=cv.getBoundingClientRect(),n=Math.min(rg,B.length);hv=Math.max(0,Math.min(n-1,Math.floor((ev.clientX-r.left-6)/(r.width-52)*n)));draw()};cv.onpointerdown=pick;cv.onpointermove=ev=>{if(ev.buttons||ev.pointerType==='mouse')pick(ev)}}
function draw(){const cv=$('#cv');if(!cv||!CH)return;const n=Math.min(rg,CH.bars.length),B=CH.bars.slice(-n),ix={};B.forEach((b,i)=>ix[b.d]=i);const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
 cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);const cs=getComputedStyle(document.documentElement),C=k=>cs.getPropertyValue(k).trim(),P={l:6,r:46,t:12,b:14};
 const lo=Math.min(...B.map(b=>b.l))*.995,hi=Math.max(...B.map(b=>b.h))*1.005,bw=(w-P.l-P.r)/n,X=i=>P.l+(i+.5)*bw,Y=v=>P.t+(hi-v)/(hi-lo)*(h-P.t-P.b);
 g.font='11px system-ui';g.textAlign='left';for(let k=0;k<4;k++){const v=lo+(hi-lo)*k/3,y=Y(v);g.strokeStyle=C('--line');g.beginPath();g.moveTo(P.l,y);g.lineTo(w-P.r,y);g.stroke();g.fillStyle=C('--mute');g.fillText(v.toFixed(v<100?1:0),w-P.r+6,y+4)}
 B.forEach((b,i)=>{const up=b.c>=b.o;g.strokeStyle=g.fillStyle=C(up?'--buy':'--sell');g.beginPath();g.moveTo(X(i),Y(b.h));g.lineTo(X(i),Y(b.l));g.stroke();g.fillRect(X(i)-bw*.33,Math.min(Y(b.o),Y(b.c)),bw*.66,Math.max(1,Math.abs(Y(b.o)-Y(b.c))))});
 const tri=(x,y,d,col)=>{g.fillStyle=col;g.beginPath();g.moveTo(x,y);g.lineTo(x-6,y+d*11);g.lineTo(x+6,y+d*11);g.closePath();g.fill()};g.textAlign='center';g.font='bold 11px system-ui';
 CH.trades.forEach(t=>{const a=ix[t.entry_date],z=t.status==='ปิดแล้ว'?ix[t.exit_date]:undefined;if(a!==undefined)tri(X(a),Y(B[a].l)+3,1,C('--buy'));
  if(z!==undefined){tri(X(z),Y(B[z].h)-3,-1,C('--sell'));const v=cap()*t.ret;g.fillStyle=C(v>=0?'--buy':'--sell');g.fillText(money(v),X(z),Y(B[z].h)-18)}});
 if(hv!=null&&hv<n){const b=B[hv];g.strokeStyle=C('--mute');g.setLineDash([3,3]);g.beginPath();g.moveTo(X(hv),P.t);g.lineTo(X(hv),h-P.b);g.stroke();g.setLineDash([]);$('#hov').textContent=`${b.d} · O ${b.o.toFixed(2)} H ${b.h.toFixed(2)} L ${b.l.toFixed(2)} C ${b.c.toFixed(2)}`}}
// ---------- test results of every technique ----------
let BTR=null,bgrp='all',bopen=null;
async function tests(){await refresh();if(!sel)sel=ST.items[0]?.ticker;if(!sel){$('#v').innerHTML='<div class="card m">เพิ่มหุ้นที่หน้าสัญญาณก่อน</div>';return}
 const chips=`<div class="row" style="justify-content:flex-start;flex-wrap:wrap;margin-bottom:8px">${ST.items.map(i=>`<button class="ghost" data-s="${esc(i.ticker)}" style="${i.ticker===sel?'background:var(--acc);color:#fff':''}">${esc(i.ticker)}</button>`).join('')}</div>`;
 const bind=()=>document.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{sel=e.dataset.s;bopen=null;tests()});
 let r;try{r=await A('backtest/'+sel)}catch(e){$('#v').innerHTML=chips+`<div class="card red">${esc(e.message)}</div>`;bind();return}
 const start=`<button class="btn" id="bs" style="width:100%">${r.status==='error'?'ลองใหม่':'เริ่มทดสอบทุกเทคนิคกับ '+esc(sel)}</button>`;
 if(r.status==='running'){$('#v').innerHTML=chips+`<div class="card m">กำลังทดสอบทุกเทคนิคของ ${esc(sel)} … ใช้เวลา 1-3 นาทีบน Pi (ปิดหน้านี้ได้ ระบบทำต่อเอง และเก็บผลไว้ 24 ชั่วโมง)</div>`;bind();setTimeout(()=>view==='tests'&&tests(),5000);return}
 if(r.status!=='done'){$('#v').innerHTML=chips+(r.error?`<div class="card red">${esc(r.error)}</div>`:'<div class="card m">ทดสอบย้อนหลังทุกเทคนิคกับหุ้นนี้ โดยเลือกพารามิเตอร์จากข้อมูล 70% แรก แล้วตัดสินผลจาก 30% หลังที่ไม่เคยเห็น เทียบกับการซื้อถือ</div>')+start;bind();
  $('#bs').onclick=run(async()=>{await A('backtest/'+sel,'POST',{});tests()});return}
 BTR=r.result;const bh=BTR.bh,c=cap(),G={all:'ทั้งหมด',trend:'เทรนด์',swing:'เทรดสั้น'},fin=x=>c*(1+x);
 const R=BTR.rows.filter(x=>bgrp==='all'||CAT.strategies[x.name]?.group===bgrp).sort((a,b)=>(b.test.sharpe??-9)-(a.test.sharpe??-9));

 let bal=cap();const rows=C.trades.map(t=>{const pnl=bal*t.ret;bal+=pnl;return{...t,pnl,bal}});
 $('#v').innerHTML=BK+tkchips()+`<div class="card"><div class="kv"><span>เงินเริ่มต้น</span><b>฿${fmt(cap())}</b><span>ถ้าทำตามทุกเทรด (ทบต้น) เหลือ</span><b>฿${fmt(bal)} (${money(bal-cap())})</b><span>จำนวนเทรด</span><b>${rows.length}</b></div><button class="ghost" id="csv" style="margin-top:8px">ดาวน์โหลด CSV</button></div>`+[...rows].reverse().slice(0,80).map(t=>`<div class="card"><div class="row"><div><div class="t" style="font-size:14px">${esc(t.entry_date)} → ${esc(t.status==='ปิดแล้ว'?t.exit_date:'ถืออยู่')}</div><div class="m">${t.entry_price.toFixed(2)} → ${t.exit_price.toFixed(2)}</div></div><div style="text-align:right"><b class="${t.pnl>=0?'up':'dn'}">${money(t.pnl)}</b><div class="m">${pc(t.ret)}</div></div></div></div>`).join('');
 bindGo();bindK(trades);$('#csv').onclick=()=>{const csv='วันเข้า,ราคาเข้า,วันออก,ราคาออก,ผลตอบแทน%,กำไรขาดทุน,ยอดคงเหลือ\n'+rows.map(t=>[t.entry_date,t.entry_price,t.exit_date,t.exit_price,(t.ret*100).toFixed(2),t.pnl.toFixed(0),t.bal.toFixed(0)].join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=sel+'_trades.csv';a.click()}}
function more(){const M=[['scan','🔍','สแกนหุ้น','หาหุ้นที่เพิ่งเกิดสัญญาณ ปรับสัญญาณเองได้ละเอียด'],['wf','🧠','Walk-forward','ฝึกซ้ำทีละช่วงเพื่อดูว่าผลนิ่งไหม'],['cust','🛠️','ระบบเลือกเอง','เลือกอินดิเคเตอร์และค่าเอง ดูจุดซื้อขายและกำไรขาดทุน'],['ai','🤖','ผู้ช่วย AI','ให้คะแนนโอกาสสำเร็จ พร้อมผลวัดจริงของโมเดล'],['trades','📋','รายการเทรด','ตารางเทรดย้อนหลัง กำไรขาดทุนเป็นเงิน ดาวน์โหลด CSV']];
 $('#v').innerHTML=`<h3>เมนู</h3><div class="card">${M.map(([g,i,t,d])=>`<button class="li row" data-go="${g}" style="width:100%"><div style="text-align:left"><div class="t" style="font-size:15px">${i} ${t}</div><div class="m">${d}</div></div><b>›</b></button>`).join('')}</div><div class="m" style="margin:10px 4px">ผลของแต่ละเมนูคำนวณเบื้องหลังแล้วบันทึกไว้ หน้านี้เปิดอ่านได้ทันทีโดยไม่กินแรม งานแจ้งเตือนมาก่อนเสมอ</div>`;bindGo()}
async function scan(){await refresh();const r=await A('scanu'),run_=r.status==='running',ks=Object.keys(CAT.scan_specs);
 const inp=(n,k,v)=>`<label class="m" style="display:block">${PT[k]||k}<input type="number" data-sp="${n}|${k}" value="${SC.specs[n]?.[k]??v}" step="${FL.includes(k)||!Number.isInteger(v)?0.05:1}" style="width:100%;margin-top:2px"></label>`;
 $('#v').innerHTML=`<button class="ghost" data-go="more" style="margin-bottom:8px">‹ เมนู</button>
 <div class="card"><div class="m">หุ้นที่สแกน</div><div class="seg">${[['sp500','S&P 500'],['custom','รายชื่อเอง']].map(([k,t])=>`<button data-u="${k}" class="${SC.u===k?'on':''}">${t}</button>`).join('')}</div>${SC.u==='custom'?`<input id="cu" value="${esc(SC.custom)}" style="width:100%" placeholder="NVDA, AMD, MSFT">`:'<div class="m">ดึงรายชื่อล่าสุดจาก Wikipedia ใช้เวลาหลายนาทีบน Pi ทำงานเบื้องหลัง</div>'}</div>
 <h3>สัญญาณที่ใช้ (เลือกได้หลายตัว)</h3><div class="card"><div class="row" style="justify-content:flex-start;margin-bottom:8px"><button class="ghost" data-q="trend">เทรนด์</button><button class="ghost" data-q="swing">เทรดสั้น</button><button class="ghost" data-q="all">ทั้งหมด</button></div>
 <div class="row" style="justify-content:flex-start;flex-wrap:wrap;gap:6px">${ks.map(n=>`<button class="ghost" data-n="${n}" style="${SC.names.includes(n)?'background:var(--acc);color:#fff':''}">${esc(slab(n))}</button>`).join('')}</div>
 ${SC.names.map(n=>Object.keys(CAT.scan_specs[n]).length?`<details style="margin-top:10px"><summary class="t" style="font-size:14px">⚙️ ปรับค่า ${esc(slab(n))}</summary><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">${Object.entries(CAT.scan_specs[n]).map(([k,v])=>inp(n,k,v)).join('')}</div></details>`:'').join('')}
 <div class="m" style="margin-top:8px">ทุกหุ้นใช้ค่าชุดเดียวกัน ไม่ได้ปรับตามหุ้นแต่ละตัว</div></div>
 <h3>ตัวกรอง</h3><div class="card"><div class="li row"><span>สัญญาณซื้อใหม่อย่างน้อย (ตัว)</span><input type="number" id="f1" value="${SC.minf}" min="0" max="12"></div><div class="li row" id="f2"><span>เฉพาะราคาเหนือ SMA200</span>${sw(SC.up)}</div><div class="li row"><span>ซื้อขาย/วัน อย่างน้อย (ล้าน$)</span><input type="number" id="f3" value="${SC.vol}" min="0"></div></div>
 <button class="btn" id="go" style="width:100%" ${run_?'disabled':''}>${run_?'กำลังสแกน…':'🔍 สแกนตอนนี้'}</button>
 ${run_?`<div class="card m" style="margin-top:10px">ความคืบหน้า ${r.done}/${r.total} <div style="height:6px;background:var(--line);border-radius:9px;margin-top:6px"><div style="height:6px;width:${r.total?r.done/r.total*100:0}%;background:var(--acc);border-radius:9px"></div></div>ปิดหน้านี้ได้ ระบบทำต่อเอง</div>`:''}${r.error?`<div class="card red" style="margin-top:10px">${esc(r.error)}</div>`:''}<div id="res"></div>`;
 const rd=()=>{SC.minf=+$('#f1').value||0;SC.vol=+$('#f3').value||0;if($('#cu'))SC.custom=$('#cu').value;document.querySelectorAll('[data-sp]').forEach(e=>{const[n,k]=e.dataset.sp.split('|');(SC.specs[n]=SC.specs[n]||{})[k]=FL.includes(k)?+e.value:Math.round(+e.value)});SS()};
 document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));
 document.querySelectorAll('[data-u]').forEach(e=>e.onclick=()=>{rd();SC.u=e.dataset.u;SS();scan()});
 document.querySelectorAll('[data-n]').forEach(e=>e.onclick=()=>{rd();const n=e.dataset.n;SC.names=SC.names.includes(n)?SC.names.filter(x=>x!==n):[...SC.names,n];SS();scan()});
 document.querySelectorAll('[data-q]').forEach(e=>e.onclick=()=>{rd();SC.names=ks.filter(n=>e.dataset.q==='all'||CAT.strategies[n]?.group===e.dataset.q||(n==='gtr'&&e.dataset.q==='swing'));SS();scan()});
 $('#f2').onclick=()=>{rd();SC.up=!SC.up;SS();scan()};['f1','f3'].forEach(i=>$('#'+i).onchange=()=>{rd();showRes(r)});
 $('#go').onclick=run(async()=>{rd();if(!SC.names.length)return toast('เลือกสัญญาณอย่างน้อย 1 ตัว');await A('scanu','POST',{universe:SC.u,tickers:SC.custom.split(/[,\s]+/).filter(Boolean),names:SC.names,specs:Object.fromEntries(SC.names.map(n=>[n,SC.specs[n]||{}]))});scan()});
 showRes(r);if(run_)setTimeout(()=>view==='scan'&&scan(),5000)}
function showRes(r){const el=$('#res');if(!el||r.status!=='done'||!r.rows)return;const m=SC;
 const L=r.rows.filter(x=>x.n_fresh>=m.minf&&(!m.up||x.above_sma200)&&(x.dollar_vol||0)>=m.vol*1e6).sort((a,b)=>b.n_fresh-a.n_fresh||b.n_long-a.n_long||b.ret_3m-a.ret_3m);
 el.innerHTML=`<h3>ผลสแกน ${esc((r.started||'').replace('T',' '))} · ผ่านตัวกรอง ${L.length}/${r.rows.length}</h3>`+(L.length?L.slice(0,60).map(x=>`<div class="card"><div class="row"><div><div class="t">${esc(x.ticker)}</div><div class="m">${esc(x.name||'')}${x.sector?' · '+esc(x.sector):''}</div></div><div style="text-align:right"><b>${x.close.toFixed(2)}</b><div class="m">${esc(x.date)}</div></div></div>
 <div class="m" style="margin:6px 0">ใหม่: <b>${x.fresh.length?x.fresh.map(slab).map(esc).join(', '):'-'}</b> · อยู่ในโหมดซื้อ ${x.n_long} ตัว</div>
 <div class="m">1M ${pc(x.ret_1m)} · 3M ${pc(x.ret_3m)} · 12M ${pc(x.ret_12m)} · RSI ${x.rsi14==null?'-':x.rsi14.toFixed(0)} · ห่างสูงสุด ${pc(x.from_high)}</div>
 <div class="row" style="margin-top:8px;justify-content:flex-start"><button class="ghost" data-c="${esc(x.ticker)}">ดูกราฟ</button><button class="ghost" data-w="${esc(x.ticker)}">+ ติดตาม</button></div></div>`).join(''):'<div class="card m">ไม่มีหุ้นผ่านตัวกรองตอนนี้ ลองลดจำนวนสัญญาณขั้นต่ำหรือปิดตัวกรอง SMA200</div>')+'<div class="m" style="margin:8px 4px">การสแกนบอกแค่ว่าวันนี้เกิดสัญญาณตามกฎที่ตั้ง ไม่ได้บอกว่าเคยได้ผลกับหุ้นตัวนั้น และไม่ใช่การทำนาย ลองใช้เมนูผลทดสอบตรวจย้อนหลังก่อนตัดสินใจ รายชื่อ S&P 500 เป็นสมาชิกปัจจุบัน (survivorship bias)</div>';
 el.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>{sel=e.dataset.c;go('detail')});
 el.querySelectorAll('[data-w]').forEach(e=>e.onclick=run(async()=>{await A('watchlist','POST',{ticker:e.dataset.w,strategy:'gtr_default'});toast('เพิ่ม '+e.dataset.w+' ในรายการติดตามแล้ว')}))}
// ---------- alerts ----------
async function alerts(){await refresh();const S=ST.settings,hist=await A('signals').catch(()=>[]);
 const ch=[['ha','มือถือผ่าน Home Assistant','แอป Companion (เลือกเครื่องที่ตัวเลือก ha_notify)'],['persist','การ์ดแจ้งเตือนใน HA','ไอคอนระฆังใน Home Assistant'],['ntfy','ntfy','ต้องตั้ง ntfy_topic'],['tg','Telegram','ต้องตั้ง tg_token และ tg_chat']],
 ev=[['buy','สัญญาณซื้อใหม่'],['sell','สัญญาณขาย'],['sl','ราคาแตะ Stop-loss'],['tp','ราคาแตะ Take-profit']];
 $('#v').innerHTML=`<h3>ช่องทางแจ้งเตือน</h3><div class="card">${ch.map(([k,t,d])=>`<div class="li row"><div data-c="${k}" style="flex:1"><div class="t" style="font-size:15px">${t}</div><div class="m">${d}</div></div><button class="ghost" data-x="${k}">ทดสอบ</button>${sw(S.channels[k])}</div>`).join('')}</div>
 <h3>แจ้งเมื่อ</h3><div class="card">${ev.map(([k,t])=>`<div class="li row" data-e="${k}"><span>${t}</span>${sw(S.events[k])}</div>`).join('')}</div>
 <h3>ตั้งค่าอื่น ๆ</h3><div class="card"><div class="li row"><span>เวลาสแกนทุกวัน (ไทย, อังคาร-เสาร์)</span><input type="time" id="tm" value="${S.time}"></div><div class="li row"><span>เงินลงทุนต่อเทรด (บาท)</span><input type="number" id="cp" value="${S.capital}" step="1000" min="0"></div></div>
 <h3>ประวัติสัญญาณ</h3><div class="card">${hist.length?hist.slice(0,30).map(h=>`<div class="li row"><div><div class="t" style="font-size:14px">${esc(h.ticker)} · ${({buy:'ซื้อ',sell:'ขาย',sl:'Stop-loss',tp:'เป้ากำไร'})[h.ev]||h.ev}</div><div class="m">${esc(h.d)}</div></div><b>${Number(h.price).toFixed(2)}</b></div>`).join(''):'<div class="m">ยังไม่มีสัญญาณ</div>'}</div>`;
 const put=run(async b=>{await A('settings','PUT',b);alerts()});
 document.querySelectorAll('[data-c]').forEach(e=>e.parentElement.querySelector('.sw').onclick=e.onclick=()=>put({channels:{[e.dataset.c]:!S.channels[e.dataset.c]}}));
 document.querySelectorAll('[data-e]').forEach(e=>e.onclick=()=>put({events:{[e.dataset.e]:!S.events[e.dataset.e]}}));
 document.querySelectorAll('[data-x]').forEach(e=>e.onclick=run(async()=>{const r=await A('test-notify','POST',{channel:e.dataset.x});toast(Object.values(r)[0]==='ok'?'ส่งทดสอบแล้ว ดูที่มือถือ':String(Object.values(r)[0]))}));
 $('#tm').onchange=e=>put({time:e.target.value});$('#cp').onchange=e=>put({capital:Math.max(0,+e.target.value||0)})}
function go(v){view=v;hv=null;const t={today:'สัญญาณวันนี้',detail:sel||'กราฟ',tests:'ผลทดสอบ',alerts:'แจ้งเตือน',more:'เพิ่มเติม',scan:'สแกนหุ้น',wf:'Walk-forward',cust:'ระบบเลือกเอง',ai:'ผู้ช่วย AI',trades:'รายการเทรด'};$('#ttl').firstChild.textContent=t[v];
 $('#sub').textContent=v==='today'?new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long'}):v==='detail'?'กราฟและระดับซื้อขาย':v==='alerts'?'เลือกว่าอยากให้เตือนอะไร ทางไหน':v==='tests'?'ผลของแต่ละเทคนิคกับหุ้นที่เลือก':v==='scan'?'หาหุ้นที่เพิ่งเกิดสัญญาณ':v==='more'?'เมนูทั้งหมด':'ผลที่คำนวณไว้แล้ว เปิดดูได้ทันที';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(['scan','wf','cust','ai','trades'].includes(v)?'more':v)));run({today,detail,tests,alerts,more,scan,wf,cust,ai,trades}[v])().then(()=>{if(v==='detail')$('#ttl').firstChild.textContent=sel||'กราฟ'});scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#th').onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).colorScheme.includes('dark');theme=dark?'light':'dark';d.dataset.theme=theme;store.set('theme',theme);draw()};
addEventListener('resize',draw);go('today');if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
